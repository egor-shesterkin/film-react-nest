server {
  listen 80;
  server_name api.egorfilm.nomorepartiessite.ru;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name api.egorfilm.nomorepartiessite.ru;

  ssl_certificate /etc/letsencrypt/live/egorfilm.nomorepartiessite.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/egorfilm.nomorepartiessite.ru/privkey.pem;

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://backend:3000;
  }
}

server {
  listen 80 default_server;
  server_name egorfilm.nomorepartiessite.ru localhost _;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl default_server;
  server_name egorfilm.nomorepartiessite.ru localhost _;

  ssl_certificate /etc/letsencrypt/live/egorfilm.nomorepartiessite.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/egorfilm.nomorepartiessite.ru/privkey.pem;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://backend:3000;
  }

  location /content/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://backend:3000;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
